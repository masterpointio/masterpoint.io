<text class="row" x="95" y="82">standard</text>
<text class="ts" x="84" y="132" text-anchor="middle" transform="rotate(-90 84 132)">attempts / sec</text>
<line x1="95" y1="142" x2="650" y2="142" stroke="#8a8a80" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>
<text class="ts" x="648" y="136" text-anchor="end">service throttle limit</text>
<line x1="95" y1="196" x2="650" y2="196" stroke="#8a8a80" stroke-width="1" opacity="0.45"/>
<text class="loud" x="648" y="104" text-anchor="end">rate never adapts</text>
<text class="ts" x="648" y="214" text-anchor="end">still retrying</text>
<text class="row" x="95" y="252">adaptive</text>
<text class="ts" x="84" y="302" text-anchor="middle" transform="rotate(-90 84 302)">attempts / sec</text>
<line x1="95" y1="312" x2="650" y2="312" stroke="#8a8a80" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>
<text class="ts" x="648" y="306" text-anchor="end">service throttle limit</text>
<line x1="95" y1="366" x2="650" y2="366" stroke="#8a8a80" stroke-width="1" opacity="0.45"/>
