<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" fill="#16160f" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Send rate versus the service throttle limit, standard mode compared with adaptive mode</title>
<desc id="dsc">Two rows on the same vertical scale of attempts per second. In standard mode the client's send rate sawtooths well above the service throttle limit for the whole run and never adapts, so most requests come back throttled. In adaptive mode the same opening burst exceeds the limit, then the rate limiter cuts the send rate below the limit and climbs back on a cubic curve, settling just underneath it, and the remaining requests are evenly paced and mostly succeed. Shapes are illustrative rather than captured from a real run.</desc>
<style>
  :root { --ink: #16160f; --soft: #55554c; }
  text {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    fill: var(--ink);
  }
  .ts { fill: var(--soft); font-size: 11px; }
  .row { font-size: 15px; }
  .loud { font-size: 14px; font-weight: 500; }
  #wipe {
    transform-box: fill-box;
    transform-origin: 0 50%;
    animation: wipe 9s linear infinite;
  }
  .head { animation: sweep 9s linear infinite; }
  @keyframes wipe {
    0% { transform: scaleX(0); }
    78% { transform: scaleX(1); }
    100% { transform: scaleX(1); }
  }
  @keyframes sweep {
    0% { transform: translateX(0); opacity: .8; }
    78% { transform: translateX(550px); opacity: .8; }
    90% { transform: translateX(550px); opacity: 0; }
    100% { transform: translateX(550px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #wipe { animation: none; transform: scaleX(1); }
    .head { animation: none; opacity: 0; }
  }
</style>
