<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" fill="#16160f" aria-labelledby="ttl dsc" role="img" viewBox="0 0 700 420"><title id="ttl">Send rate versus the service throttle limit, standard mode compared with adaptive mode</title><desc id="dsc">Two rows on the same vertical scale of attempts per second. In standard mode the client&apos;s send rate sawtooths well above the service throttle limit for the whole run and never adapts, so most requests come back throttled. In adaptive mode the same opening burst exceeds the limit, then the rate limiter cuts the send rate below the limit and climbs back on a cubic curve, settling just underneath it, and the remaining requests are evenly paced and mostly succeed. Shapes are illustrative rather than captured from a real run.</desc><style>@keyframes wipe{0%{transform:scaleX(0)}78%{transform:scaleX(1)}}@keyframes sweep{0%{transform:translateX(0);opacity:.8}78%{transform:translateX(550px);opacity:.8}90%{transform:translateX(550px);opacity:0}}:root{--ink:#16160f;--soft:#55554c}text{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:var(--ink)}.ts{fill:var(--soft);font-size:11px}.row{font-size:15px}.loud{font-size:14px;font-weight:500}#wipe{transform-box:fill-box;transform-origin:0 50%;animation:wipe 9s linear infinite}.head{animation:sweep 9s linear infinite}@media (prefers-reduced-motion:reduce){#wipe,.head{animation:none}#wipe{transform:scaleX(1)}.head{opacity:0}}</style><clipPath id="reveal"><rect id="wipe" width="560" height="290" x="94" y="86"/></clipPath><text x="95" y="82" class="row">standard</text><text x="84" y="132" class="ts" text-anchor="middle" transform="rotate(-90 84 132)">attempts / sec</text><line x1="95" x2="650" y1="142" y2="142" stroke="#8a8a80" stroke-dasharray="6 4" stroke-width="1.5" opacity=".75"/><text x="648" y="136" class="ts" text-anchor="end">service throttle limit</text><line x1="95" x2="650" y1="196" y2="196" stroke="#8a8a80" stroke-width="1" opacity=".45"/><text x="648" y="104" class="loud" text-anchor="end">rate never adapts</text><text x="648" y="214" class="ts" text-anchor="end">still retrying</text><text x="95" y="252" class="row">adaptive</text><text x="84" y="302" class="ts" text-anchor="middle" transform="rotate(-90 84 302)">attempts / sec</text><line x1="95" x2="650" y1="312" y2="312" stroke="#8a8a80" stroke-dasharray="6 4" stroke-width="1.5" opacity=".75"/><text x="648" y="306" class="ts" text-anchor="end">service throttle limit</text><line x1="95" x2="650" y1="366" y2="366" stroke="#8a8a80" stroke-width="1" opacity=".45"/><g clip-path="url(#reveal)"><path fill="none" stroke="#2a78d6" stroke-linejoin="round" stroke-width="2" d="M 95 168 L 104 98 L 118 108 L 126 100 L 140 130 L 150 112 L 162 148 L 172 104 L 186 126 L 198 106 L 212 132 L 224 102 L 240 128 L 252 108 L 268 134 L 280 104 L 296 126 L 310 110 L 326 150 L 340 102 L 356 128 L 370 112 L 388 130 L 402 104 L 420 126 L 436 110 L 454 132 L 470 106 L 490 128 L 506 112 L 526 130 L 542 104 L 562 126 L 580 112 L 600 130 L 620 106 L 640 124 L 650 116"/><path fill="none" stroke="#2a78d6" stroke-linejoin="round" stroke-width="2" d="M 95 338 L 104 268 L 118 276 L 130 270 L 140 330 Q 190 326 240 318 Q 280 314 300 313 L 306 324 Q 360 317 420 313 Q 490 311 540 311"/><path fill="none" stroke="#8a8a80" stroke-width="1" d="M 152 303 L 144 324" opacity=".7"/><text x="156" y="299" class="ts">throttling detected, rate cut</text><g fill="#1baf7a"><rect width="3" height="14" x="98" y="182" rx="1.5"/><rect width="3" height="14" x="105" y="182" rx="1.5"/><rect width="3" height="14" x="214" y="182" rx="1.5"/><rect width="3" height="14" x="259" y="182" rx="1.5"/><rect width="3" height="14" x="325" y="182" rx="1.5"/><rect width="3" height="14" x="362" y="182" rx="1.5"/><rect width="3" height="14" x="402" y="182" rx="1.5"/><rect width="3" height="14" x="455" y="182" rx="1.5"/><rect width="3" height="14" x="481" y="182" rx="1.5"/><rect width="3" height="14" x="508" y="182" rx="1.5"/><rect width="3" height="14" x="522" y="182" rx="1.5"/><rect width="3" height="14" x="548" y="182" rx="1.5"/><rect width="3" height="14" x="578" y="182" rx="1.5"/><rect width="3" height="14" x="592" y="182" rx="1.5"/><rect width="3" height="14" x="619" y="182" rx="1.5"/><rect width="3" height="14" x="632" y="182" rx="1.5"/><rect width="3" height="14" x="645" y="182" rx="1.5"/></g><g fill="#e34948"><rect width="3" height="14" x="112" y="182" rx="1.5"/><rect width="3" height="14" x="119" y="182" rx="1.5"/><rect width="3" height="14" x="126" y="182" rx="1.5"/><rect width="3" height="14" x="133" y="182" rx="1.5"/><rect width="3" height="14" x="140" y="182" rx="1.5"/><rect width="3" height="14" x="147" y="182" rx="1.5"/><rect width="3" height="14" x="154" y="182" rx="1.5"/><rect width="3" height="14" x="161" y="182" rx="1.5"/><rect width="3" height="14" x="193" y="182" rx="1.5"/><rect width="3" height="14" x="201" y="182" rx="1.5"/><rect width="3" height="14" x="222" y="182" rx="1.5"/><rect width="3" height="14" x="236" y="182" rx="1.5"/><rect width="3" height="14" x="248" y="182" rx="1.5"/><rect width="3" height="14" x="271" y="182" rx="1.5"/><rect width="3" height="14" x="283" y="182" rx="1.5"/><rect width="3" height="14" x="312" y="182" rx="1.5"/><rect width="3" height="14" x="338" y="182" rx="1.5"/><rect width="3" height="14" x="349" y="182" rx="1.5"/><rect width="3" height="14" x="377" y="182" rx="1.5"/><rect width="3" height="14" x="389" y="182" rx="1.5"/><rect width="3" height="14" x="418" y="182" rx="1.5"/><rect width="3" height="14" x="468" y="182" rx="1.5"/><rect width="3" height="14" x="495" y="182" rx="1.5"/><rect width="3" height="14" x="535" y="182" rx="1.5"/><rect width="3" height="14" x="605" y="182" rx="1.5"/></g><g fill="#1baf7a"><rect width="3" height="14" x="98" y="352" rx="1.5"/><rect width="3" height="14" x="105" y="352" rx="1.5"/><rect width="3" height="14" x="190" y="352" rx="1.5"/><rect width="3" height="14" x="210" y="352" rx="1.5"/><rect width="3" height="14" x="230" y="352" rx="1.5"/><rect width="3" height="14" x="250" y="352" rx="1.5"/><rect width="3" height="14" x="270" y="352" rx="1.5"/><rect width="3" height="14" x="310" y="352" rx="1.5"/><rect width="3" height="14" x="330" y="352" rx="1.5"/><rect width="3" height="14" x="350" y="352" rx="1.5"/><rect width="3" height="14" x="370" y="352" rx="1.5"/><rect width="3" height="14" x="390" y="352" rx="1.5"/><rect width="3" height="14" x="410" y="352" rx="1.5"/><rect width="3" height="14" x="430" y="352" rx="1.5"/><rect width="3" height="14" x="450" y="352" rx="1.5"/><rect width="3" height="14" x="470" y="352" rx="1.5"/><rect width="3" height="14" x="490" y="352" rx="1.5"/><rect width="3" height="14" x="510" y="352" rx="1.5"/></g><g fill="#e34948"><rect width="3" height="14" x="112" y="352" rx="1.5"/><rect width="3" height="14" x="119" y="352" rx="1.5"/><rect width="3" height="14" x="126" y="352" rx="1.5"/><rect width="3" height="14" x="133" y="352" rx="1.5"/><rect width="3" height="14" x="140" y="352" rx="1.5"/><rect width="3" height="14" x="147" y="352" rx="1.5"/><rect width="3" height="14" x="154" y="352" rx="1.5"/><rect width="3" height="14" x="161" y="352" rx="1.5"/><rect width="3" height="14" x="290" y="352" rx="1.5"/></g><circle cx="530" cy="359" r="5" fill="#1baf7a"/><text x="543" y="363" class="ts">run completes</text></g><line x1="95" x2="95" y1="88" y2="372" stroke="#8a8a80" stroke-width="1.5" class="head" opacity=".8"/><rect width="9" height="9" x="95" y="391" fill="#1baf7a" rx="2"/><text x="110" y="399" class="ts">succeeded</text><rect width="9" height="9" x="184" y="391" fill="#e34948" rx="2"/><text x="199" y="399" class="ts">throttled</text><line x1="266" x2="286" y1="396" y2="396" stroke="#2a78d6" stroke-width="2"/><text x="292" y="399" class="ts">send rate</text><line x1="364" x2="384" y1="396" y2="396" stroke="#8a8a80" stroke-dasharray="6 4" stroke-width="1.5"/><text x="390" y="399" class="ts">throttle limit<