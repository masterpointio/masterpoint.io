<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="preview-title preview-desc">
  <title id="preview-title">Infrastructure CI checklist</title>
  <desc id="preview-desc">Five check marks and checklist rows on a dark teal background.</desc>
  <!-- Checklist paths, strokes, and color gradient preserved from the approved native artwork. -->
  <defs>
    <linearGradient id="atmosphere" x1="0" y1="0" x2="1" y2=".53">
      <stop offset=".36" stop-color="#222222" stop-opacity="0"/>
      <stop offset=".76" stop-color="#222222" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d191bf" stop-opacity=".125"/>
    </linearGradient>
  </defs>
  <path fill="#0e383a" d="M0 0H800V800H0Z"/>
  <path fill="url(#atmosphere)" d="M0 0H800V800H0Z"/>
  <defs>
    <linearGradient id="checks-color" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ece295"/>
      <stop offset=".48" stop-color="#55c1b4"/>
      <stop offset="1" stop-color="#d191bf"/>
    </linearGradient>
  </defs>
  <style>
    .boxes { fill: none; stroke: #55c1b4; stroke-opacity: .4; stroke-width: 2; }
    .ticks { fill: none; stroke: url(#checks-color); stroke-width: 5; stroke-linecap: square; stroke-linejoin: miter; }
    .lines { fill: none; stroke: #f3f3f3; stroke-opacity: .65; stroke-width: 3; }
  </style>
  <g transform="translate(176 161) scale(1.32)">
