<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sr-root" viewBox="0 0 700 250" width="700" height="250" role="img" aria-labelledby="sr-ttl sr-dsc">
<title id="sr-ttl">One slow span in the trace is many throttled retries in the logs</title>
<desc id="sr-dsc">Top: the trace shows a single resource-planning span lasting 2 minutes 55 seconds. Bottom, on the same time axis: the debug logs show twelve throttled API attempts, each followed by a backoff wait that doubles from 1 second up to a 20 second cap, and a thirteenth attempt that succeeds. Almost all of the span is waiting. The retry schedule is illustrative.</desc>
