<text class="rt-t" x="75" y="115" text-anchor="middle">queue</text>
<text class="rt-s" x="75" y="144" text-anchor="middle">not in any trace</text>
<rect x="118" y="96" width="72" height="30" rx="4" fill="#2a78d6"/>
<text class="rt-m" x="154" y="88" text-anchor="middle">tofu init</text>
<line x1="154" y1="126" x2="154" y2="186" stroke="#2a78d6" stroke-width="1.5" opacity=".7"/>
<rect x="198" y="96" width="182" height="30" rx="4" fill="#2a78d6"/>
<text class="rt-m" x="289" y="88" text-anchor="middle">tofu plan</text>
<line x1="289" y1="126" x2="289" y2="186" stroke="#2a78d6" stroke-width="1.5" opacity=".7"/>
<rect x="388" y="96" width="42" height="30" rx="4" fill="#2a78d6"/>
<text class="rt-m" x="409" y="88" text-anchor="middle">tofu show</text>
<line x1="409" y1="126" x2="409" y2="186" stroke="#2a78d6" stroke-width="1.5" opacity=".7"/>
<rect x="438" y="96" width="102" height="30" rx="4" fill="#8a8a80" fill-opacity=".1" stroke="#8a8a80" stroke-dasharray="4 3"/>
<text class="rt-t" x="489" y="115" text-anchor="middle">approval wait</text>
<text class="rt-s" x="489" y="144" text-anchor="middle">not in any trace</text>
<rect x="548" y="96" width="112" height="30" rx="4" fill="#2a78d6"/>
