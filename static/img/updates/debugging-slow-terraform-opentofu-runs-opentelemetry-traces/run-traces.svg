<line x1="604" y1="126" x2="604" y2="186" stroke="#2a78d6" stroke-width="1.5" opacity=".7"/>
<rect x="118" y="186" width="542" height="76" rx="8" fill="#2a78d6" fill-opacity=".08" stroke="#2a78d6" stroke-opacity=".7"/>
<text class="rt-b" x="134" y="208">Same resource attributes on every trace</text>
<text class="rt-m" x="134" y="229" style="fill:#2a78d6;font-weight:700">spacelift.run_id</text>
<text class="rt-t" x="246" y="229">joins init, plan, show and apply back into one run</text>
<text class="rt-ms" x="134" y="248">terraform.stack  ·  terraform.root_module  ·  git.commit_sha  ·  spacelift.run_type</text>
