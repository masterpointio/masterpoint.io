<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="rt-root" viewBox="0 0 700 294" width="700" height="294" role="img" aria-labelledby="rt-ttl rt-dsc">
<title id="rt-ttl">One CI run produces several traces that share a run ID</title>
<desc id="rt-dsc">A timeline of one Spacelift run: queue wait, tofu init, tofu plan, tofu show, approval wait, tofu apply. Each tofu command is its own trace. The queue and approval waits are not in any trace. All of the traces carry the same resource attributes, including spacelift.run_id, which is what joins them back into one run.</desc>
<style>
  .rt-root { --ink: #16160f; --soft: #55554c; --logo: #0d3f3f; }
  .rt-root text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .rt-root .rt-t { fill: var(--soft); font-size: 11px; }
  .rt-root .rt-s { fill: var(--soft); font-size: 10px; }
  .rt-root .rt-b { font-size: 12.5px; font-weight: 600; }
  .rt-root .rt-h { font-size: 14px; font-weight: 600; }
  .rt-root .rt-m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 10px; }
  .rt-root .rt-ms { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 10px; fill: var(--soft); }

      .rt-lg-1 {
        fill: url(#rt-lgrad-4);
      }

      .rt-lg-1, .rt-lg-2, .rt-lg-3, .rt-lg-4, .rt-lg-5, .rt-lg-6, .rt-lg-7, .rt-lg-8 {
        fill-rule: evenodd;
      }

      .rt-lg-2 {
        fill: var(--logo);
      }

      .rt-lg-3 {
        fill: url(#rt-lgrad-2);
      }

      .rt-lg-4 {
        fill: url(#rt-lgrad);
      }

      .rt-lg-5 {
        fill: url(#rt-lgrad-6);
      }

      .rt-lg-6 {
        fill: url(#rt-lgrad-5);
      }

      .rt-lg-7 {
        fill: url(#rt-lgrad-7);
      }

      .rt-lg-8 {
        fill: url(#rt-lgrad-3);
      }
    </style>
<text class="rt-h" x="350" y="32" text-anchor="middle">One Spacelift run</text>
