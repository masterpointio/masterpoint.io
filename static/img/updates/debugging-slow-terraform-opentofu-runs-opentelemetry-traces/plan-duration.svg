      .pd-lg-2 {
        fill: var(--logo);
      }

      .pd-lg-3 {
        fill: url(#pd-lgrad-2);
      }

      .pd-lg-4 {
        fill: url(#pd-lgrad);
      }

      .pd-lg-5 {
