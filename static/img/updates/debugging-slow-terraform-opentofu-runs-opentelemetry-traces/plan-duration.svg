<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="pd-root" viewBox="0 0 700 138" width="700" height="138" role="img" aria-labelledby="pd-ttl pd-dsc">
<title id="pd-ttl">Plan duration with and without the Route 53 resources</title>
<desc id="pd-dsc">Two horizontal bars on a scale of zero to seven minutes. The full plan of roughly 3,000 resources took between five and seven minutes. A diagnostic plan that excluded the Route 53 resources took around two minutes.</desc>
<style>
  .pd-root { --ink: #16160f; --soft: #55554c; --logo: #0d3f3f; }
  @media (prefers-color-scheme: dark) { .pd-root { --ink: #f2f1ea; --soft: #b5b4ab; --logo: #ffffff; } }
  .pd-root text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .pd-root .pd-t { fill: var(--soft); font-size: 11px; }
  .pd-root .pd-s { fill: var(--soft); font-size: 10px; }
  .pd-root .pd-b { font-size: 12.5px; font-weight: 600; }
  .pd-root .pd-h { font-size: 14px; font-weight: 600; }
  .pd-root .pd-m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 10px; }
  .pd-root .pd-ms { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 10px; fill: var(--soft); }

      .pd-lg-1 {
        fill: url(#pd-lgrad-4);
      }

      .pd-lg-1, .pd-lg-2, .pd-lg-3, .pd-lg-4, .pd-lg-5, .pd-lg-6, .pd-lg-7, .pd-lg-8 {
        fill-rule: evenodd;
