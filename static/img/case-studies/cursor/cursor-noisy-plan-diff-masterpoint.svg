<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 316" width="660" height="316" role="img" aria-labelledby="ti de">
<title id="ti">A Terraform plan buried in ECS drift</title>
<desc id="de">A plan output scrolls endlessly through changes that are almost entirely unrelated ECS task definition drift, with placeholder service names. Partway down the scroll halts, the noise dims, and two unintended changes are revealed among the drift and tagged UNINTENDED: a security group rule opening a CIDR block to the world, and an ALB listener rule broadening its path pattern. The scroll then resumes and wraps seamlessly.</desc>
<rect x="0" y="0" width="660" height="316" fill="#ffffff"/>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
  .card{fill:#f7f6f1;stroke:#e2e1d7;stroke-width:1}
  .hd{fill:#16160f;font-size:12px;font-weight:700}
  .hd2{fill:#8a8a80;font-size:12px}
  .chg{fill:#a06a00;font-weight:700}
  .l0,.fl{fill:#55554c}
  .l1,.l2,.note{fill:#8a8a80}
  .hotln{fill:#c9443d}
  .foot{fill:#9e2a24;font-weight:400;animation:weight 5s linear infinite}
  .tag{fill:#c9443d;font-weight:700;letter-spacing:1px;opacity:0;
       animation:pop 5s steps(1,end) infinite}
  .frame{fill:#fff;stroke:#d8d7cd;stroke-width:.5}
  .track{fill:#d8d7cd}
  .thumb{fill:#c3c2b7;animation:slide 5s linear infinite}
  .band{fill:rgba(224,90,82,.16)}
  .scroll{animation:roll 5s linear infinite}
  .dim{animation:fade 5s linear infinite}
  .hot{opacity:0;animation:reveal 5s linear infinite}
  @keyframes roll{
    0%{transform:translateY(0)}
    36%,84%{transform:translateY(-684px)}
    100%{transform:translateY(-976px)}
  }
  @keyframes slide{
    0%{transform:translateY(0)}
    36%,84%{transform:translateY(123px)}
    100%{transform:translateY(176px)}
  }
  @keyframes fade{0%,36%{opacity:1}40%,80%{opacity:.18}84%,100%{opacity:1}}
  @keyframes reveal{0%,36%{opacity:0}40%,80%{opacity:1}84%,100%{opacity:0}}
  @keyframes pop{0%{opacity:0}36%{opacity:1}80%{opacity:0}}
  @keyframes weight{0%,36%{font-weight:400}40%,80%{font-weight:700}84%,100%{font-weight:400}}
  
  @media (prefers-reduced-motion:reduce){
    .scroll,.dim,.hot,.tag,.foot,.thumb{animation:none}
    .thumb{transform:translateY(123px)}
    .scroll{transform:translateY(-684px)}
    .dim{opacity:.18}
    .hot,.tag{opacity:1}
    .foot{font-weight:700}
  }
</style>
