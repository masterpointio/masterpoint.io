<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-labelledby="ti de">
<title id="ti">Individual versus batched API calls against a strict rate limit</title>
<desc id="de">Two lanes crossing a dashed line marking a cloud API with strict rate rate limits. Request volume comes from the sheer number of Terraform resources, each one issuing its own API request. In the top lane each of thirty resources is its own call: the requests reach the limit, turn red as they are throttled and are thrown all the way back to the start, and most never get through at all. In the bottom lane the same thirty resources travel as three batches of ten, each crossing the limit unobstructed on the first attempt and turning green.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .lbl{fill:#55554c;font-size:13px}
  .note{fill:#8a8a80;font-size:12px}
  .gate{stroke:#c3c2b7;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
  .gatelbl{fill:#55554c;font-size:13px}
  .gatesub{fill:#8a8a80;font-size:12px}
  .foot{fill:#9e2a24;font-size:12px;font-weight:700}
  .dot{fill:#8a8a80;opacity:0}
  .batch{animation:send 6s linear infinite}
  .bbox{fill:#f2f1ea;stroke:#c3c2b7;stroke-width:1;animation:boxpass 6s linear infinite}
  .bdot{fill:#8a8a80;animation:dotpass 6s linear infinite}

  @keyframes send{0%{transform:translateX(0)}100%{transform:translateX(780px)}}
  @keyframes boxpass{0%,52%{stroke:#c3c2b7}55%,100%{stroke:#2f9e6f}}
  @keyframes dotpass{0%,52%{fill:#8a8a80}55%,100%{fill:#2f9e6f}}
  @keyframes reja{
    0%{transform:translateX(0);opacity:0;fill:#8a8a80}
    2%{opacity:1}
    14%{transform:translateX(206px)}
    16%{fill:#c9443d}
    30%{transform:translateX(10px)}
    44%{transform:translateX(206px)}
    58%{transform:translateX(10px)}
    72%{transform:translateX(206px)}
    86%{transform:translateX(10px);opacity:1}
    94%,100%{transform:translateX(10px);opacity:0}
  }
  @keyframes rejb{
    0%{transform:translateX(0);opacity:0;fill:#8a8a80}
    2%{opacity:1}
    17%{transform:translateX(200px)}
    19%{fill:#c9443d}
    33%{transform:translateX(16px)}
    47%{transform:translateX(200px)}
    61%{transform:translateX(16px)}
    75%{transform:translateX(200px)}
    89%{transform:translateX(16px);opacity:1}
    97%,100%{transform:translateX(16px);opacity:0}
  }
  @keyframes rejc{
    0%{transform:translateX(0);opacity:0;fill:#8a8a80}
    2%{opacity:1}
    12%{transform:translateX(210px)}
    14%{fill:#c9443d}
    28%{transform:translateX(6px)}
    42%{transform:translateX(210px)}
    56%{transform:translateX(6px)}
    70%{transform:translateX(210px)}
    84%{transform:translateX(6px);opacity:1}
    92%,100%{transform:translateX(6px);opacity:0}
  }
  @keyframes rejd{
    0%{transform:translateX(0);opacity:0;fill:#8a8a80}
    2%{opacity:1}
    19%{transform:translateX(204px)}
    21%{fill:#c9443d}
    35%{transform:translateX(12px)}
    49%{transform:translateX(204px)}
    63%{transform:translateX(12px)}
    77%{transform:translateX(204px)}
    91%{transform:translateX(12px);opacity:1}
    99%,100%{transform:translateX(12px);opacity:0}
  }
  @keyframes pasa{
    0%{transform:translateX(0);opacity:0;fill:#8a8a80}
    2%{opacity:1}
    14%{transform:translateX(206px)}
    16%{fill:#c9443d}
    30%{transform:translateX(10px)}
    44%{transform:translateX(206px)}
    48%{fill:#2f9e6f}
    72%{transform:translateX(516px);opacity:1}
    80%,100%{transform:translateX(516px);opacity:0}
  }
  @keyframes pasb{
    0%{transform:translateX(0);opacity:0;fill:#8a8a80}
    2%{opacity:1}
    18%{transform:translateX(202px)}
    20%{fill:#c9443d}
    34%{transform:translateX(14px)}
    48%{transform:translateX(202px)}
    52%{fill:#2f9e6f}
    76%{transform:translateX(516px);opacity:1}
    84%,100%{transform:translateX(516px);opacity:0}
  }

  
  @media (prefers-reduced-motion:reduce){
    .dot,.batch,.bbox,.bdot{animation:none;opacity:1}
    .dot{fill:#c9443d;transform:translateX(206px)}
    .batch{transform:translateX(460px)}
    .bbox{stroke:#2f9e6f}
    .bdot{fill:#2f9e6f}
  }
</style>
<line class="gate" x1="330" y1="70" x2="330" y2="254"/>
<text class="gatelbl" x="330" y="46" text-anchor="middle">many Terraform resources, one API request each</text>
<text class="gatesub" x="330" y="62" text-anchor="middle">against aggressively rate-limited cloud APIs</text>
<text class="lbl" x="20" y="88">unbatched</text>
<text class="note" x="640" y="88" text-anchor="end">30 calls</text>
<text class="lbl" x="20" y="182">batched</text>
<text class="note" x="640" y="182" text-anchor="end">3 calls</text>
