<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" aria-labelledby="ti de" role="img" viewBox="0 0 660 300"><title id="ti">Individual versus batched API calls against a strict rate limit</title><desc id="de">Two lanes crossing a dashed line marking a cloud API with strict rate rate limits. Request volume comes from the sheer number of Terraform resources, each one issuing its own API request. In the top lane each of thirty resources is its own call: the requests reach the limit, turn red as they are throttled and are thrown all the way back to the start, and most never get through at all. In the bottom lane the same thirty resources travel as three batches of ten, each crossing the limit unobstructed on the first attempt and turning green.</desc><style>@keyframes send{0%{transform:translateX(0)}}@keyframes boxpass{0%,52%{stroke:#c3c2b7}55%{stroke:#2f9e6f}}@keyframes dotpass{0%,52%{fill:#8a8a80}55%{fill:#2f9e6f}}@keyframes reja{0%{transform:translateX(0);opacity:0;fill:#8a8a80}2%{opacity:1}14%,44%,72%{transform:translateX(206px)}16%{fill:#c9443d}30%,58%{transform:translateX(10px)}86%{transform:translateX(10px);opacity:1}94%{transform:translateX(10px);opacity:0}}@keyframes rejb{0%{transform:translateX(0);opacity:0;fill:#8a8a80}2%{opacity:1}17%,47%,75%{transform:translateX(200px)}19%{fill:#c9443d}33%,61%{transform:translateX(16px)}89%{transform:translateX(16px);opacity:1}97%{transform:translateX(16px);opacity:0}}@keyframes rejc{0%{transform:translateX(0);opacity:0;fill:#8a8a80}2%{opacity:1}12%,42%,70%{transform:translateX(210px)}14%{fill:#c9443d}28%,56%{transform:translateX(6px)}84%{transform:translateX(6px);opacity:1}92%{transform:translateX(6px);opacity:0}}@keyframes rejd{0%{transform:translateX(0);opacity:0;fill:#8a8a80}2%{opacity:1}19%,49%,77%{transform:translateX(204px)}21%{fill:#c9443d}35%,63%{transform:translateX(12px)}91%{transform:translateX(12px);opacity:1}99%{transform:translateX(12px);opacity:0}}@keyframes pasa{0%{transform:translateX(0);opacity:0;fill:#8a8a80}2%{opacity:1}14%,44%{transform:translateX(206px)}16%{fill:#c9443d}30%{transform:translateX(10px)}48%{fill:#2f9e6f}72%{transform:translateX(516px);opacity:1}80%{transform:translateX(516px);opacity:0}}@keyframes pasb{0%{transform:translateX(0);opacity:0;fill:#8a8a80}2%{opacity:1}18%,48%{transform:translateX(202px)}20%{fill:#c9443d}34%{transform:translateX(14px)}52%{fill:#2f9e6f}76%{transform:translateX(516px);opacity:1}84%{transform:translateX(516px);opacity:0}}text{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.lbl{fill:#55554c;font-size:13px}.note{fill:#8a8a80;font-size:12px}.gate{stroke:#c3c2b7;stroke-width:1.5;stroke-dasharray:4 4;fill:none}.gatelbl{fill:#55554c;font-size:13px}.foot,.gatesub{font-size:12px}.gatesub{fill:#8a8a80}.foot{fill:#9e2a24;font-weight:700}.dot{fill:#8a8a80;opacity:0}.batch{animation:send 6s linear infinite}.bbox{fill:#f2f1ea;stroke:#c3c2b7;stroke-width:1;animation:boxpass 6s linear infinite}.bdot{fill:#8a8a80;animation:dotpass 6s linear infinite}@media (prefers-reduced-motion:reduce){.batch,.bbox,.bdot,.dot{animation:none;opacity:1}.dot{fill:#c9443d;transform:translateX(206px)}.batch{transform:translateX(460px)}.bbox{stroke:#2f9e6f}.bdot{fill:#2f9e6f}}</style><line x1="330" x2="330" y1="70" y2="254" class="gate"/><text x="330" y="46" class="gatelbl" text-anchor="middle">many Terraform resources, one API request each</text><text x="330" y="62" class="gatesub" text-anchor="middle">against aggressively rate-limited cloud APIs</text><text x="20" y="88" class="lbl">unbatched</text><text x="640" y="88" class="note" text-anchor="end">30 calls</text><text x="20" y="182" class="lbl">batched</text><text x="640" y="182" class="note" text-anchor="end">3 calls</text><circle cx="110" cy="100" r="4.5" class="dot" style="animation:reja 6s linear infinite;animation-delay:0ms"/><circle cx="110" cy="110" r="4.5" class="dot" style="animation:pasa 6s linear infinite;animation-delay:200ms"/><circle cx="110" cy="120" r="4.5" class="dot" style="animation:rejb 6s linear infinite;animation-delay:400ms"/><circle cx="110" cy="130" r="4.5" class="dot" style="animation:rejc 6s linear infinite;animation-delay:600ms"/><circle cx="110" cy="140" r="4.5" class="dot" style="animation:pasb 6s linear infinite;animation-delay:800ms"/><circle cx="110" cy="100" r="4.5" class="dot" style="animation:rejd 6s linear infinite;animation-delay:1000ms"/><circle cx="110" cy="110" r="4.5" class="dot" style="animation:reja 6s linear infinite;animation-delay:1200ms"/><circle cx="110" cy="120" r="4.5" class="dot" style="animation:pasa 6s linear infinite;animation-delay:1400ms"/><circle cx="110" cy="130" r="4.5" class="dot" style="animation:rejb 6s linear infinite;animation-delay:1600ms"/><circle cx="110" cy="140" r="4.5" class="dot" style="animation:rejc 6s linear infinite;animation-delay:1800ms"/><circle cx="110" cy="100" r="4.5" class="dot" style="animation:reja 6s linear infinite;animation-delay:2000ms"/><circle cx="110" cy="110" r="4.5" class="dot" style="animation:pasa 6s linear infinite;animation-delay:2200ms"/><circle cx="110" cy="120" r="4.5" class="dot" style="animation:rejb 6s linear infinite;animation-delay:2400ms"/><circle cx="110" cy="130" r="4.5" class="dot" style="animation:rejc 6s linear infinite;animation-delay:2600ms"/><circle cx="110" cy="140" r="4.5" class="dot" style="animation:pasb 6s linear infinite;animation-delay:2800ms"/><circle cx="110" cy="100" r="4.5" class="dot" style="animation:rejd 6s linear infinite;animation-delay:3000ms"/><circle cx="110" cy="110" r="4.5" class="dot" style="animation:reja 6s linear infinite;animation-delay:3200ms"/><circle cx="110" cy="120" r="4.5" class="dot" style="animation:pasa 6s linear infinite;animation-delay:3400ms"/><circle cx="110" cy="130" r="4.5" class="dot" style="animation:rejb 6s linear infinite;animation-delay:3600ms"/><circle cx="110" cy="140" r="4.5" class="dot" style="animation:rejc 6s linear infinite;animation-dela