name: Lint

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: masterpointio/actions/.github/workflows/lint.yaml@29a77cce711f10ead0ca4815802f254f752ad6d3 # v0.4.0
    permissions:
      actions: read # for trunk-action
      checks: write # for trunk-action
      contents: read # for trunk-action + checkout
      pull-requests: read # for action-semantic-pull-request
