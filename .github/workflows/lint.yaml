name: Lint

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publication-checks:
    name: Blog media and branch checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install publication-check dependencies
        run: |
          python3 -m venv .publication-venv
          .publication-venv/bin/pip install -r scripts/publication-requirements.txt
      - name: Test publication checks
        run: .publication-venv/bin/python -m unittest discover -s scripts -p 'test_publication.py'
      - name: Check proposed publication
        env:
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .publication-venv/bin/python scripts/check-publication.py --base "$BASE_SHA" --branch "$PR_BRANCH"
  lint:
    uses: masterpointio/actions/.github/workflows/lint.yaml@29a77cce711f10ead0ca4815802f254f752ad6d3 # v0.4.0
    permissions:
      actions: read # for trunk-action
      checks: write # for trunk-action
      contents: read # for trunk-action + checkout
      pull-requests: read # for action-semantic-pull-request
